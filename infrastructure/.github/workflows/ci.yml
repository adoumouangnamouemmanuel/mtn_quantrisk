name: CI

on:
  push:
    branches: [main, foureiratou]
  pull_request:

jobs:
  # ── Backend tests ───────────────────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the test/calc deps first; heavy ML deps are optional for the
          # service-layer tests we run here.
          pip install fastapi "uvicorn[standard]" pydantic python-multipart \
            pandas numpy scikit-learn xgboost joblib statsmodels python-dateutil \
            feedparser sqlalchemy apscheduler requests beautifulsoup4 pytest

      - name: Run pytest
        env:
          # conftest.py sets a throwaway DB_PATH; this is just a safety net.
          DB_PATH: /tmp/quantrisk_ci.db
        run: python -m pytest tests -q

  # ── Frontend lint + typecheck ───────────────────────────────────────────────
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true # lint is advisory; do not block the pipeline

      - name: Unit tests
        run: npm test
